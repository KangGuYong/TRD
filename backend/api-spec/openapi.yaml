openapi: 3.1.0
info:
  title: 트렌드 레이더 API
  version: 0.1.0
  description: >
    앱(api-public, `/v1`)과 관리자 콘솔(api-admin, `/admin`)의 단일 계약.
    상위 근거: 01-system-design.md §9, 02-admin-console.md, 04-development-plan.md §7.
    규약: 등급·판정 관련 응답은 산정 근거(`basis`/`breakdown`)를 항상 동봉한다(04 §7.3).
    판정 결과를 직접 바꾸는 엔드포인트는 존재하지 않는다(R1, 02 ADM-200 금지기능).

servers:
  - url: https://api.trendstage.kr
    description: 앱 공개 API
  - url: https://admin.trendstage.kr/api
    description: 관리자 콘솔 API

tags:
  - name: app-trends
    description: 앱 · 트렌드 조회/판정 열람
  - name: app-submissions
    description: 앱 · 제보/동의
  - name: app-me
    description: 앱 · 등급/원장/설정/워치
  - name: app-reports
    description: 앱 · 신고/소명
  - name: admin-auth
    description: 콘솔 · 인증
  - name: admin-queues
    description: 콘솔 · 큐(병합/어뷰징/이의/신고)
  - name: admin-trends
    description: 콘솔 · 트렌드/판정 관리
  - name: admin-users
    description: 콘솔 · 유저 원장/제재
  - name: admin-governance
    description: 콘솔 · 파라미터 스튜디오/2인 승인/감사 로그
  - name: admin-batch-jobs
    description: 콘솔 · 배치 작업 수동 실행

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────  앱 · 트렌드  ─────────────────────────────
  /v1/trends:
    get:
      tags: [app-trends]
      summary: 트렌드 목록 (홈 "오늘의 5개" / 검색)
      description: 정렬은 인기순이 아니라 "지금 행동해야 하는 순"이 기본(앱 설계 원칙 05).
      security: []
      parameters:
        - { name: daily, in: query, schema: { type: boolean }, description: 홈 5개 세트만 반환 }
        - { name: q, in: query, schema: { type: string }, description: 검색 판정 질의어 }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - name: sort
          in: query
          schema: { type: string, enum: [action, asked] }
          description: 기본 action(지금 행동해야 하는 순) · asked=인기 질의 추천
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrendSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/trends/{id}:
    get:
      tags: [app-trends]
      summary: 트렌드 상세 (뜻/유래/전파 경로/연령대/판정 근거)
      security: []
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trends/{id}/vote:
    post:
      tags: [app-trends]
      summary: 이거 더 뜰까요 투표 (판정과 무관 · R1)
      description: 투표는 유행 여부 판정에 절대 입력되지 않는다. 유저당 1표, 토글 가능.
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [willTrend]
              properties: { willTrend: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteResult' }

  # ─────────────────────────────  앱 · 제보  ─────────────────────────────
  /v1/submissions:
    post:
      tags: [app-submissions]
      summary: 제보 등록 (제보권 차감 · 14일 뒤 자동 판정)
      description: >
        올리는 건 사람, 채점은 기계(01 §1). 중복이면 409로 동의 전환을 안내한다.
        근거 URL 없으면 반려, 이해관계는 고지 체크 필수.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionCreate' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionMine' }
        '409':
          description: 중복 항목 — 제보권 미차감 동의로 전환 가능
          content:
            application/json:
              schema:
                type: object
                properties:
                  trendItemId: { type: string, format: uuid }
                  dupeRank: { type: integer, description: 클러스터 내 현재 제보 수 기준 순위 }
                  message: { type: string }
        '422':
          description: >
            제보를 받을 수 없음 — Problem.type으로 구분한다.
            quota-exhausted: 이번 주 제보권 소진(월 00:00 KST 리필, 제출 − VOID 반환 기준).
            item-closed: 관측이 끝난 항목(마감 이후·판정 중·판정 완료·VOID). 제보권은 쓰지 않는다. 병합된 항목 이름으로 제보하면 병합 승자에 합류한다.
            about:blank: 필드 값 오류(확신도 등).
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /v1/submissions/me:
    get:
      tags: [app-submissions]
      summary: 내 제보 목록 + 판정 상태
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubmissionMine' }
  /v1/trends/{id}/endorse:
    post:
      tags: [app-submissions]
      summary: 동의 (중복 제보를 endorsement로 전환)
      description: 제보권 미소모. 적중 시 소액 가점, 실패 무감점. 유저 단위 dedup.
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      responses:
        '201': { description: 동의 처리됨 }
        '409': { description: 이미 동의/제보한 유저 }

  # ─────────────────────────────  앱 · 신고  ─────────────────────────────
  /v1/reports:
    post:
      tags: [app-reports]
      summary: 신고 접수 (대상은 TrendItem — 개별 제보 원문은 유저에게 노출되지 않음)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportMine' }
  /v1/reports/me:
    get:
      tags: [app-reports]
      summary: 내가 접수한 신고 목록 + 처리 결과
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportMine' } }
  /v1/reports/received:
    get:
      tags: [app-reports]
      summary: 나를 지목해 소명을 요구한 신고 목록 (로그인 유저 = 지목된 submission의 작성자)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportReceived' } }
  /v1/reports/{id}/explanation:
    post:
      tags: [app-reports]
      summary: 소명 제출
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        '200': { description: 제출됨 }
        '403': { description: 소명 대상으로 지목되지 않음 }
        '409': { description: 소명을 제출할 수 있는 상태(EXPLAINING)가 아님 }

  # ─────────────────────────────  앱 · 나  ─────────────────────────────
  /v1/me/grade:
    get:
      tags: [app-me]
      summary: 등급 · AS · TI · 다음 승급 부족분 (산정 근거 동봉)
      description: >
        grade는 주간 스냅샷(월 00:00 KST 재계산)이다. requirements는 다음 등급까지를 지금 값(TI 최근 180일·AS 행별 감쇠)으로
        계산한다. 요건을 모두 채웠으면 note로 반영 시점을 알린다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeStatus' }
  /v1/me/ledger:
    get:
      tags: [app-me]
      summary: 점수 원장 전건 열람 (append-only)
      parameters: [{ name: cursor, in: query, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
                  nextCursor: { type: [string, 'null'] }
  /v1/me/preferences:
    put:
      tags: [app-me]
      summary: 관심 분야 · 알림 시간 (온보딩/설정)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
  /v1/me/watch:
    get:
      tags: [app-me]
      summary: 워치 목록
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WatchItem' } }
    post:
      tags: [app-me]
      summary: 워치 추가 (급상승 진입 시 즉시 알림)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties: { keyword: { type: string } }
      responses:
        '201': { description: 추가됨 }
  /v1/me/watch/{keyword}:
    delete:
      tags: [app-me]
      summary: 워치 해제
      parameters: [{ name: keyword, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 해제됨 }
  /v1/appeals:
    post:
      tags: [app-me]
      summary: 판정·제재 이의 제기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealCreate' }
      responses:
        '201': { description: 접수됨 (처리기한 5영업일) }
  /v1/leaderboard:
    get:
      tags: [app-me]
      summary: 상위 10 (동의자 한정 노출)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } }

  # ─────────────────────────────  콘솔 · 인증  ─────────────────────────────
  /admin/auth/csrf:
    get:
      tags: [admin-auth]
      summary: CSRF 쿠키 발급 (SPA 부팅용) — 응답에 XSRF-TOKEN 쿠키
      responses:
        '200': { description: OK (본문 없음) }
  /admin/auth/login:
    post:
      tags: [admin-auth]
      summary: 관리자 로그인 — X-XSRF-TOKEN 헤더 필수. 5회 연속 실패 시 15분 잠금
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string }
      responses:
        '200': { description: 로그인 성공 — 세션 ID·CSRF 토큰 교체 }
        '401': { description: 아이디 또는 비밀번호 불일치 }
        '403': { description: "CSRF 토큰 누락·불일치, 비활성 계정, 또는 승인 대기 중인 계정" }
        '423': { description: 연속 실패로 잠금 중 }

  # ─────────────────────────────  콘솔 · 큐  ─────────────────────────────
  /admin/queues/summary:
    get:
      tags: [admin-queues]
      summary: 오늘의 작업 (ADM-010) — 큐 카운트 · SLA 초과 · 시스템 알림
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSummary' }
  /admin/merge-queue:
    get:
      tags: [admin-queues]
      summary: 병합 검수 큐 (ADM-100) — 유사도 0.75~0.85 구간
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [similarity, oldest] } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MergeCandidate' }
  /admin/merge-queue/{id}/preview:
    get:
      tags: [admin-queues]
      summary: 병합 후 미리보기(dry-run) — 선점 순위(시딩 제외)·중복 VOID·제보권 반환·관측 마감 조정
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergePreview' }
        '422': { description: 없는 후보이거나 이미 처리됨 }
  /admin/merge-queue/{id}/merge:
    post:
      tags: [admin-queues]
      summary: 병합 확정 (REVIEWER 이상) — 늦게 생긴 항목을 먼저 생긴 항목으로 흡수
      description: |
        두 항목을 id 오름차순으로 행 잠금한 뒤, 둘 다 판정 전 상태이고 현행 판정 행이 없을 때만 병합한다.
        병합으로 관측 마감이 병합 시점 + 3일보다 이르면 그 시점으로 연장한다(상한 최초 제보 + 21일).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeDecisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/MergeDecided' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MergeConflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyMismatch' }
  /admin/merge-queue/{id}/separate:
    post:
      tags: [admin-queues]
      summary: 별도 항목으로 분리 (REVIEWER 이상) — 후보 기각, 데이터 변경 없음
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeDecisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/MergeDecided' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MergeConflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyMismatch' }
  /admin/merge-queue/{id}/void:
    post:
      tags: [admin-queues]
      summary: 새 항목 VOID (OPERATOR 이상) — 판정 전 항목만. 판정된 항목은 ADM-200(/admin/verdicts)으로 안내
      description: >
        큐 결정은 멱등키로 즉시 확정되는 흐름이라 승인 대기를 끼우지 않는다(K8) — 상쇄액이 100점을 넘는 판정된
        항목이면 409 void-needs-approval로 거절하고, 큐 항목은 PENDING으로 남는다.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeDecisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/MergeDecided' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            merge-target-merged(대상이 이미 병합됨) · merge-queue-decided(다른 요청이 이미 처리함) ·
            void-needs-approval(판정된 항목이라 상쇄액이 100점 초과 — ADM-200 판정 관리에서 VOID) ·
            approval-pending(이 항목에 이미 대기 중인 승인 요청이 있음)
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/IdempotencyKeyMismatch' }

  # ─────────────────────────────  콘솔 · 트렌드/수집  ────────────────────
  /admin/trends/{id}:
    get:
      tags: [admin-trends]
      summary: 트렌드 항목 상세 (ADM-111) — 지표 시계열 · 예상 판정(잠정)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTrendDetail' }
  /admin/verdicts:
    get:
      tags: [admin-trends]
      summary: 판정 완료 목록 + 판정 임박 목록 (ADM-200) — 조회는 OPERATOR/ADMIN/AUDITOR
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerdictListResponse' }
  /admin/verdicts/{id}/void:
    post:
      tags: [admin-trends]
      summary: 판정 VOID (OPERATOR/ADMIN) — R1 직접 결과 편집 없음, JudgeService가 다시 판정해 VOID를 쌓음
      description: >
        HIT/MISS 직접 변경·T 수동입력·verdict 삭제는 제공하지 않는다(금지기능).
        원 판정 차액이 100점(ApprovalGate.THRESHOLD)을 넘으면 즉시 반영하지 않고 2인 승인 대기를 만든다.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 즉시 반영됨(status=APPLIED)
          content: { application/json: { schema: { $ref: '#/components/schemas/VerdictActionResult' } } }
        '202':
          description: 상쇄액 100점 초과 — 2인 승인 대기 생성됨(status=PENDING_APPROVAL)
          content: { application/json: { schema: { $ref: '#/components/schemas/VerdictActionResult' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: approval-pending — 이 항목에 이미 대기 중인 승인 요청(재판정 또는 VOID)이 있음
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /admin/verdicts/{id}/rejudge:
    post:
      tags: [admin-trends]
      summary: 재판정 요청 (OPERATOR/ADMIN) — 새 verdict를 supersedes로 쌓고 차액을 ADJ 원장으로 반영
      description: 원 판정 때 동결한 파라미터를 그대로 다시 쓴다(J2). 100점 초과 상쇄는 2인 승인 대기.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 즉시 반영됨(status=APPLIED)
          content: { application/json: { schema: { $ref: '#/components/schemas/VerdictActionResult' } } }
        '202':
          description: 상쇄액 100점 초과 — 2인 승인 대기 생성됨(status=PENDING_APPROVAL)
          content: { application/json: { schema: { $ref: '#/components/schemas/VerdictActionResult' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: approval-pending — 이 항목에 이미 대기 중인 승인 요청(재판정 또는 VOID)이 있음
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /admin/verdicts/{id}/extend-grace:
    post:
      tags: [admin-trends]
      summary: 판정 유예 연장 (OPERATOR/ADMIN) — 미판정 항목만, 상한 최초 제보 + 21일
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TrendId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 7 }
                reason: { type: string }
      responses:
        '200': { description: 연장됨(본문 없음) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: "연장 일수 범위 초과, 이미 판정됨, 또는 이미 최대 유예 기간 도달" }
  # ─────────────────────────────  콘솔 · 유저/원장  ─────────────────────
  /admin/users:
    get:
      tags: [admin-users]
      summary: 유저 검색 (ADM-311 근거 화면) — 핸들 접두 검색, 최대 20건, 조회는 R/O/A/Au
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: handle, in: query, schema: { type: string }, description: 핸들 접두(대소문자 무관). 없거나 공백이면 422 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserHit' } }
        '422': { description: 핸들을 입력하세요 }
  /admin/users/{id}:
    get:
      tags: [admin-users]
      summary: 유저 상세 / 원장 (ADM-311) — 이의 제기 대응 근거 화면, 산정 근거(basis) 동봉
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{id}/ledger-adjustments:
    post:
      tags: [admin-users]
      summary: 상쇄 원장(ADJ) 추가 (OPERATOR/ADMIN) — 기존 판정 불변, ADJ 행만 덧붙임
      description: >
        사유 필수, 금액은 0이 아니고 ±9999 이내. ADMIN이 100점(ApprovalGate.THRESHOLD) 이하로 조정하면 즉시 기록,
        OPERATOR이거나 100점 초과면 2인 승인 대기(K3).
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: ADJ 즉시 기록됨(status=APPLIED)
          content: { application/json: { schema: { $ref: '#/components/schemas/LedgerAdjustResult' } } }
        '202':
          description: 2인 승인 대기 생성됨(status=PENDING_APPROVAL)
          content: { application/json: { schema: { $ref: '#/components/schemas/LedgerAdjustResult' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "사유 누락, 금액이 0이거나 ±9999를 벗어남" }

  # ─────────────────────────────  콘솔 · 거버넌스  ─────────────────────
  /admin/parameter-drafts:
    get:
      tags: [admin-governance]
      summary: 파라미터 드래프트 목록 (ADM-600)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ParameterDraft' } }
    post:
      tags: [admin-governance]
      summary: 드래프트 생성 (가중치 합계 1.0 아니면 저장 불가)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParameterPayload' }
      responses:
        '201':
          description: 생성됨
          content: { application/json: { schema: { $ref: '#/components/schemas/ParameterDraft' } } }
        '422': { description: 가중치 합계 ≠ 1.0 }
  /admin/parameter-drafts/{id}/simulate:
    post:
      tags: [admin-governance]
      summary: 시뮬레이션 (과거 180일 재판정) — 승인 요청 전 필수
      description: 같은 ScoreEngine을 임의 ParameterSet으로 호출(04 §1). 결과 없으면 승인요청 불가.
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
  /admin/parameter-drafts/{id}/request-approval:
    post:
      tags: [admin-governance]
      summary: 적용 승인 요청 (시뮬 완료 시에만) — 기본 예약(비소급)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applyMode, applyAt]
              properties:
                applyMode: { type: string, enum: [SCHEDULED, RETROACTIVE] }
                applyAt: { type: string, format: date-time }
                rationale: { type: string, description: RETROACTIVE는 사유서 필수 }
      responses:
        '202': { description: 승인 대기 생성됨 (0/2) }
        '409': { description: 시뮬레이션 미실행 }
  /admin/approvals:
    get:
      tags: [admin-governance]
      summary: 2인 승인 대기 목록 (ADM-620) — 조회는 ADMIN/AUDITOR
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }
  /admin/approvals/{id}/approve:
    post:
      tags: [admin-governance]
      summary: 승인 (ADMIN) — 요청자 본인이거나 승인 자격(유예 경과)이 없으면 409
      description: 2인 승인 = 요청자 + 승인자 1명(SP3 K1) — 승인 1회로 실행기까지 한 트랜잭션에서 끝난다.
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 승인·실행 반영됨
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } }
        '409': { description: "요청자 본인이거나 이미 처리됨, 또는 승인 자격이 아직 없음(승인권 유예 중)" }
  /admin/approvals/{id}/reject:
    post:
      tags: [admin-governance]
      summary: 반려 (ADMIN) — 대상을 DRAFT 등 재수정 가능한 상태로 되돌린다
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: 반려 사유(필수) }
      responses:
        '200':
          description: 반려됨
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } }
        '409': { description: 이미 처리된 요청 }
        '422': { description: 반려 사유 누락 }
  /admin/audit-log:
    get:
      tags: [admin-governance]
      summary: 감사 로그 (ADM-700) — append-only. REVIEWER 접근 불가, OPERATOR는 본인 행만, ADMIN/AUDITOR는 전체
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string, format: uuid }, description: OPERATOR로 요청하면 무시되고 본인 id로 강제된다 }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: ISO-8601(예 2026-09-23T00:00:00Z) }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: ISO-8601(예 2026-09-23T00:00:00Z) }
        - { name: beforeId, in: query, schema: { type: integer, format: int64 }, description: "커서 — 이 id보다 작은 행부터(내림차순, 100건씩)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
                  nextBeforeId: { type: [integer, 'null'], format: int64 }
        '422': { description: from/to가 ISO-8601 형식이 아님 }

  # ══════════════ 확장 엔드포인트 (05-screen-endpoint-map §C) ══════════════
  /v1/me/summary:
    get:
      tags: [app-me]
      summary: 홈/제보/나 공용 요약 (스트릭·제보권·적중률·읽은 수)
      description: >
        quotaUsed = 이번 주(월 00:00 KST~) 낸 제보 − 이번 주 VOID로 반환된 제보. quotaMax는 주간 스냅샷 등급의 한도.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MeSummary' } } }
  /v1/me/reads:
    post:
      tags: [app-me]
      summary: 읽음 표시 기록 (홈 완독 스트릭)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trendId]
              properties: { trendId: { type: string, format: uuid } }
      responses:
        '204': { description: 기록됨 }

  /admin/trends:
    get:
      tags: [admin-trends]
      summary: 트렌드 목록/필터 (ADM-110)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [PENDING, JUDGING, RESOLVED, VOID, MERGED] } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminTrendListItem' } }
                  nextCursor: { type: [string, 'null'] }
  /admin/abuse-flags:
    get:
      tags: [admin-users]
      summary: 어뷰징 플래그 큐 (ADM-300)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AbuseFlag' } }
  /admin/abuse-flags/{id}/resolve:
    post:
      tags: [admin-users]
      summary: 오탐 처리 / 경고 / 에스컬레이션 (플래그만, 제재 아님 · R4)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, reason]
              properties:
                resolution: { type: string, enum: [DISMISS, WARN, ESCALATE] }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { description: 처리됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/sanctions:
    get:
      tags: [admin-users]
      summary: 제재 목록 (ADM-320)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Sanction' } }
    post:
      tags: [admin-users]
      summary: 제재 상신 (OPERATOR → ADMIN 2인 승인)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, type, reason]
              properties:
                targetUserId: { type: string, format: uuid }
                type: { type: string, enum: [WARNING, GRADE_RESET, SUSPEND] }
                reason: { type: string, minLength: 1 }
      responses:
        '202': { description: 상신됨 — 승인 대기 생성 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{id}/grade-adjust:
    post:
      tags: [admin-users]
      summary: 미구현(Phase 2) — 등급 수동 조정 (ADMIN 2인 · 다음 재계산 시 원복 경고)
      description: >
        미구현(Phase 2). ADM-310의 grade/hasFlags/cursor 필터 유저 목록도 미구현 — 현재는
        `GET /admin/users?handle=` 핸들 검색만 있다.
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade, reason]
              properties:
                grade: { $ref: '#/components/schemas/Grade' }
                reason: { type: string, minLength: 1 }
      responses:
        '202': { description: 2인 승인 대기 생성됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/appeals:
    get:
      tags: [admin-queues]
      summary: 이의 제기 큐 (ADM-400)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Appeal' } }
  /admin/appeals/{id}/resolve:
    post:
      tags: [admin-queues]
      summary: 이의 결정 (인용 시 ADJ 발생 · 근거수치 통보)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [UPHELD, PARTIAL, REJECTED] }
                note: { type: string }
      responses:
        '200': { description: 처리됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reports:
    get:
      tags: [admin-queues]
      summary: 신고 콘텐츠 큐 (ADM-410 · OPEN/EXPLAINING만 · 신고자 비식별)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Report' } }
  /admin/reports/{id}/submissions:
    get:
      tags: [admin-queues]
      summary: 해당 트렌드의 제보 원문 목록 — 관리자가 소명 대상을 지목할 후보(자동 추정 없음)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportSubmissionCandidate' } }
  /admin/reports/{id}/hide:
    post:
      tags: [admin-queues]
      summary: 즉시 비공개 + 소명 요청 (1차 처리)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId]
              properties:
                submissionId: { type: string, format: uuid, description: 관리자가 지목한 문제 제보 }
                note: { type: string }
      responses:
        '200':
          description: 처리됨
          content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } }
        '422': { description: submissionId 누락 또는 해당 트렌드에 속하지 않는 제보 }
  /admin/reports/{id}/request-explanation:
    post:
      tags: [admin-queues]
      summary: 공개 유지한 채 소명 요청 (1차 처리)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId]
              properties:
                submissionId: { type: string, format: uuid }
                note: { type: string }
      responses:
        '200':
          description: 처리됨
          content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } }
        '422': { description: submissionId 누락 또는 해당 트렌드에 속하지 않는 제보 }
  /admin/reports/{id}/decide:
    post:
      tags: [admin-queues]
      summary: 신고 최종 결정 (복원 / 영구비공개 / 수정후복원) — OPERATOR 이상
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [RESTORE, HIDE_PERMANENT, EDIT_RESTORE] }
                note: { type: string }
                newCanonicalName: { type: string, description: EDIT_RESTORE일 때 필수 }
      responses:
        '200':
          description: 처리됨
          content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } }
        '403': { description: OPERATOR 미만 }
        '422':
          description: >
            RESTORE는 OPEN·EXPLAINING(미결정) 상태여야 하고, HIDE_PERMANENT·EDIT_RESTORE는 EXPLAINING 상태여야
            함(오신고는 1차 처리 없이 RESTORE 가능 · K9). EDIT_RESTORE인데 newCanonicalName 누락도 422.
  /admin/seeding:
    post:
      tags: [admin-trends]
      summary: 시딩 등록 (is_seed=true · 점수 원장 미반영 · ADM-500)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionCreate' }
      responses:
        '201': { description: 시딩 등록됨 }
  /admin/seeding/stats:
    get:
      tags: [admin-trends]
      summary: 시딩 비중 · 담당자별 적중률
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeedingStats' } } }
  /admin/grade-policy:
    get:
      tags: [admin-governance]
      summary: 등급 정책 조회 (ADM-610)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/GradePolicy' } } }
    post:
      tags: [admin-governance]
      summary: 등급 정책 드래프트 (적용은 2인 승인)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradePolicy' }
      responses:
        '201': { description: 드래프트 생성됨 }
  /admin/accounts:
    get:
      tags: [admin-governance]
      summary: 관리자 계정 목록 (ADM-800) — ADMIN/AUDITOR
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminAccountSummary' } }
    post:
      tags: [admin-governance]
      summary: 관리자 계정 생성 (ADMIN) — 승인 자격자가 0명이면 부트스트랩 예외로 단독 생성
      description: >
        승인 자격 있는 다른 ADMIN이 없으면(K6) 승인 없이 즉시 생성(201). 그 외에는 2인 승인 대기(202).
        새 계정·ADMIN 승격의 승인권은 생성 후 7일간 없다.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, displayName, role, password]
              properties:
                loginId: { type: string }
                displayName: { type: string }
                role: { type: string, enum: [REVIEWER, OPERATOR, ADMIN, AUDITOR] }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: 부트스트랩 — 즉시 생성됨(status=CREATED_BOOTSTRAP)
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreateResponse' } } }
        '202':
          description: 2인 승인 대기 생성됨(status=PENDING_APPROVAL)
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreateResponse' } } }
        '409': { description: 이미 존재하는 아이디입니다 }
        '422': { description: "아이디·이름·비밀번호 누락, 비밀번호 8자 미만, 알 수 없는 역할" }
  /admin/accounts/{id}/role:
    post:
      tags: [admin-governance]
      summary: 권한 부여/회수 (ADMIN 상신 → 2인 승인)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { type: string, enum: [REVIEWER, OPERATOR, ADMIN, AUDITOR] }
                reason: { type: string, minLength: 1 }
      responses:
        '202':
          description: 2인 승인 대기 생성됨
          content:
            application/json:
              schema:
                type: object
                properties: { approvalRequestId: { type: string, format: uuid } }
        '403': { description: 본인 계정의 역할은 바꿀 수 없음 }
        '422': { description: "존재하지 않는 계정, 사유 누락, 이미 같은 역할, 또는 알 수 없는 역할" }
  /admin/accounts/{id}/disable:
    post:
      tags: [admin-governance]
      summary: 관리자 계정 비활성화 (ADMIN) — 즉시 반영, 승인 불필요
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountSummary' } } }
        '403': { description: 본인 계정은 비활성화할 수 없음 }
        '422': { description: 존재하지 않는 계정 }
  /admin/accounts/{id}/enable:
    post:
      tags: [admin-governance]
      summary: 관리자 계정 재활성화 (ADMIN) — 승인 대기 계정(activatedAt=null)은 불가
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountSummary' } } }
        '422': { description: "존재하지 않는 계정, 또는 승인 대기 계정이라 활성화 불가" }
  /admin/me/password:
    post:
      tags: [admin-governance]
      summary: 내 비밀번호 변경
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, next]
              properties:
                current: { type: string }
                next: { type: string, minLength: 8 }
      responses:
        '200': { description: 변경됨(본문 없음) }
        '422': { description: "현재 비밀번호 불일치, 새 비밀번호 누락·8자 미만·현재와 동일" }

  # ─────────────────────────────  콘솔 · 배치 작업  ─────────────────────────
  /admin/batch-jobs/cluster-merge/run:
    post:
      tags: [admin-batch-jobs]
      summary: cluster_merge 배치 수동 실행 (OPERATOR 이상)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: 실행 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterMergeResult"
        '409':
          description: 이미 실행 중(크론 또는 다른 관리자가 실행 중)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 앱 유저 JWT(액세스+리프레시 회전)
    cookieAuth:
      type: apiKey
      in: cookie
      name: TRD_ADMIN_SESSION
      description: >
        콘솔 세션(30분 타임아웃, 2FA 미구현). 쓰기 요청은 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보내야 한다.
        RBAC는 서버 권한 매트릭스로 강제(02 §1.1). 세션 재검증(SP3): `/admin/auth/login`·`/admin/auth/logout`·`/admin/auth/csrf`를
        제외한 모든 `/admin/**` 요청마다 계정을 다시 읽어 비활성·역할 변경이면 세션을 폐기하고 401
        `{type: session-revoked}`로 끊는다.

  parameters:
    TrendId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 80 }
      description: 결정 요청의 멱등키. 같은 키 재요청은 이전 결과를 그대로 돌려준다(merge_queue.decision_key UNIQUE).

  responses:
    Unauthorized:
      description: 인증 필요
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: 권한 부족 (RBAC / 등급)
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: 없음
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    MergeDecided:
      description: 처리됨(같은 키 재요청이면 replayed=true)
      content: { application/json: { schema: { $ref: '#/components/schemas/MergeDecisionResponse' } } }
    MergeConflict:
      description: |
        병합 불가. type으로 구분 — merge-judging(판정 중, 재시도 의미 있음) · merge-resolved(판정 완료·VOID·판정 행 존재, 영구)
        · merge-target-merged(대상이 이미 병합됨, 후보를 정리함) · merge-queue-decided(다른 요청이 이미 처리함)
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IdempotencyKeyRequired:
      description: Idempotency-Key 헤더 없음 또는 형식 오류 (type idempotency-key-required)
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IdempotencyKeyMismatch:
      description: 같은 키로 다른 결정, 또는 키가 다른 후보에 이미 쓰임 (type idempotency-key-mismatch)
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      description: RFC 9457 형식 오류 응답
      type: object
      properties:
        type: { type: string, description: "about:blank | quota-exhausted | item-closed | merge-judging | merge-resolved | merge-target-merged | merge-queue-decided | idempotency-key-required | idempotency-key-mismatch | approval-pending | void-needs-approval | session-revoked" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Category:
      type: string
      enum: [MEME, PRODUCT, PERSON_CHANNEL, CHALLENGE, SLANG, ETC]
    Stage:
      description: 표시용 단계 (색은 여기에만 쓴다)
      type: string
      enum: [SEED, RISING, PEAK, FADING]
    ReachLevel:
      type: string
      enum: [L1, L2, L3, L4]
    Grade:
      type: string
      enum: [L0, L1, L2, L3, L4]

    TrendSummary:
      type: object
      required: [id, word, meaning, stage]
      properties:
        id: { type: string, format: uuid }
        word: { type: string, description: canonical_name }
        meaning: { type: string }
        stage: { $ref: '#/components/schemas/Stage' }
        stageLabel: { type: string, example: 급상승 }
        lifeText: { type: string, description: "숫자보다 문장", example: "3주쯤 남았어요" }
        dText: { type: string, example: "D-38" }
        pathText: { type: string, example: "디시 → X → 인스타" }
        reachedCount: { type: integer }
        ageShort: { type: string, example: "20대 52%" }

    PropagationStep:
      type: object
      properties:
        channel: { type: string, example: "디시·더쿠" }
        date: { type: [string, 'null'] }
        note: { type: string }
        reached: { type: boolean }
    AgeBand:
      type: object
      properties:
        label: { type: string, example: "20대" }
        pct: { type: integer }
    TrendDetail:
      allOf:
        - $ref: '#/components/schemas/TrendSummary'
        - type: object
          properties:
            verdict: { type: string, example: "지금이 적기예요" }
            verdictWhy: { type: string }
            reachLevel: { $ref: '#/components/schemas/ReachLevel' }
            origin: { type: string }
            example: { type: string }
            ageSentence: { type: string }
            ages: { type: array, items: { $ref: '#/components/schemas/AgeBand' } }
            propagationPath: { type: array, items: { $ref: '#/components/schemas/PropagationStep' } }
            voteCount: { type: string, example: "2,160명 참여 · 뜬다 85%" }
            watched: { type: boolean }

    VoteResult:
      type: object
      properties:
        willTrend: { type: boolean }
        voteCount: { type: string }

    SubmissionCreate:
      type: object
      required: [name, category, platform, evidenceUrl, confidence, disclosure, oneLine]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        platform: { type: string, description: 최초 목격 플랫폼 (디시 갤러리명 등) }
        evidenceUrl: { type: string, format: uri }
        confidence: { type: integer, enum: [10, 30, 50] }
        disclosure: { type: boolean, description: 이해관계 고지 (미고지 적발 시 제재 근거) }
        oneLine: { type: string, maxLength: 200 }
    SubmissionMine:
      type: object
      properties:
        id: { type: string, format: uuid }
        word: { type: string }
        status: { type: string, enum: [PENDING, HIT, MISS, VOID] }
        reachLevel: { $ref: '#/components/schemas/ReachLevel' }
        delta: { type: [number, 'null'] }
        confidence: { type: integer }
        orderRank: { type: [integer, 'null'], description: 판정 전에는 파생 잠정값 }
        note: { type: string, description: 산정 근거 (예 "T=0.61 · 후속 제보자 12명") }
        judgeInDays: { type: [integer, 'null'], description: 판정까지 남은 일수 }
        createdAt: { type: string, format: date-time }

    GradeRequirement:
      type: object
      description: 승급은 AS와 TI를 모두(AND) 만족해야 함(R3)
      properties:
        label: { type: string, example: "신뢰도 지수 TI" }
        current: { type: number }
        required: { type: number }
        met: { type: boolean }
        basis: { type: string, description: 산정 근거 문자열, example: "TI 0.48 / 요구치 0.55 / 부족분 0.07" }
    GradeStatus:
      type: object
      properties:
        grade: { $ref: '#/components/schemas/Grade' }
        gradeName: { type: string, example: 탐지자 }
        trustIndex: { type: number }
        activeScore: { type: number }
        judgedCount: { type: integer }
        nextGrade: { type: string }
        requirements: { type: array, items: { $ref: '#/components/schemas/GradeRequirement' } }
        note: { type: string }

    LedgerEntry:
      type: object
      properties:
        word: { type: string }
        kind: { type: string, enum: [HIT, MISS, VOID, ADJ] }
        delta: { type: number }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    Preferences:
      type: object
      properties:
        categories: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Category' } }
        notifyHour: { type: integer, minimum: 0, maximum: 23, example: 8 }
    WatchItem:
      type: object
      properties:
        keyword: { type: string }
        stage: { $ref: '#/components/schemas/Stage' }
        note: { type: string }
    AppealCreate:
      type: object
      required: [targetType, targetId]
      properties:
        targetType: { type: string, enum: [VERDICT, SANCTION, GRADE] }
        targetId: { type: string, format: uuid }
        reason: { type: string }
    LeaderboardEntry:
      type: object
      properties:
        handle: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        trustIndex: { type: number }

    # ── 콘솔 스키마 ──
    QueueSummary:
      type: object
      properties:
        slaBreaches: { type: integer }
        queues:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: ADM-100 }
              name: { type: string }
              count: { type: integer }
              oldest: { type: string, example: "26h" }
              slaExceeded: { type: boolean }
              available: { type: boolean, description: "false면 큐 자체가 미구현(Phase 2) — count는 의미 없음" }
        alerts:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              detail: { type: string }
        seedRatio: { type: number, description: 시딩 비중 (Phase 2 전환 기준 70%) }
    MergeCandidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        similarity: { type: number, example: 0.82 }
        newName: { type: string }
        oldName: { type: string }
        oldClusterId: { type: string, format: uuid }
        orderPreview: { type: array, items: { type: string }, description: 병합 시 선점 순위 미리보기 }
        submitterGrade: { $ref: '#/components/schemas/Grade' }
    AdminTrendDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [DRAFT, PENDING, JUDGING, RESOLVED, VOID, MERGED] }
        dayOfWindow: { type: integer, example: 9 }
        distinctSubmitters: { type: integer, description: 서로 다른 제보자 수 (판정 입력) }
        distinctPlatforms: { type: integer, description: 서로 다른 최초 목격 플랫폼 수 }
        provisionalT: { type: number, description: 잠정값. 확정 아님(D+14 재계산) }
        provisionalVerdict: { type: string, example: "HIT / L3 (잠정)" }
    UserHit:
      description: GET /admin/users 검색 결과 1건
      type: object
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        joinedAt: { type: string }
    AdminLedgerRow:
      description: >
        AdminUserDetail.ledger[] 1행. R2(원장 불변)의 근거 화면이라 verdictId·approvedBy·approvalId까지 보여준다.
        delta 외 전 필드는 null일 수 있다(예 ADJ 행은 verdictId null, 자동 판정 행은 approvedBy·approvalId null).
      type: object
      properties:
        id: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'] }
        kind: { type: [string, 'null'], description: "HIT | MISS | VOID | ADJ" }
        delta: { type: number }
        reason: { type: [string, 'null'] }
        trendItemName: { type: [string, 'null'], description: ADJ 행처럼 판정과 연결되지 않으면 null }
        verdictId: { type: [string, 'null'], format: uuid }
        approvedBy: { type: [string, 'null'], description: 승인 실행으로 기록된 행만 존재(관리자 표시 이름) }
        approvalId: { type: [string, 'null'], format: uuid }
    AdminUserDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        status: { type: string }
        joinedAt: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        gradeComputedAt: { type: [string, 'null'] }
        trustIndex: { type: number }
        activeScore: { type: number }
        judgedCount: { type: integer }
        hitInWindow: { type: integer, description: 최근 180일 HIT }
        missInWindow: { type: integer, description: 최근 180일 MISS }
        basis: { type: array, items: { type: string }, description: "TI·AS·판정 건수 산정 근거 문장(관리자 API 규약)" }
        abuseFlagCount: { type: integer }
        ledger: { type: array, items: { $ref: '#/components/schemas/AdminLedgerRow' } }
    LedgerAdjustResult:
      type: object
      properties:
        status: { type: string, enum: [APPLIED, PENDING_APPROVAL] }
        ledgerId: { type: [string, 'null'], description: APPLIED일 때만 값 있음 }
        approvalRequestId: { type: [string, 'null'], description: PENDING_APPROVAL일 때만 값 있음 }
        amount: { type: number }
    VerdictActionResult:
      description: ADM-200 VOID·재판정 결과
      type: object
      properties:
        status: { type: string, enum: [APPLIED, PENDING_APPROVAL] }
        verdictId: { type: [string, 'null'], description: APPLIED일 때만 값 있음 }
        approvalRequestId: { type: [string, 'null'], description: PENDING_APPROVAL일 때만 값 있음 }
        adjTotal: { type: number, description: 이 조치로 발생하는 상쇄 원장(ADJ) 절댓값 합 }
    VerdictJudgedItem:
      type: object
      properties:
        trendItemId: { type: string, format: uuid }
        canonicalName: { type: string }
        result: { type: string, description: "판정 이력이 없으면 '-'" }
        reachLevel: { $ref: '#/components/schemas/ReachLevel' }
        scoreT: { type: [string, 'null'] }
        judgedAt: { type: [string, 'null'] }
        superseded: { type: boolean, description: 재판정으로 대체된 이전 판정 여부 }
    VerdictImminentItem:
      type: object
      properties:
        trendItemId: { type: string, format: uuid }
        canonicalName: { type: string }
        firstSeenAt: { type: string }
        deadline: { type: string }
        daysLeft: { type: integer }
        graceExtended: { type: boolean }
    VerdictListResponse:
      type: object
      properties:
        judged: { type: array, items: { $ref: '#/components/schemas/VerdictJudgedItem' } }
        imminent: { type: array, items: { $ref: '#/components/schemas/VerdictImminentItem' }, description: 마감 임박순 최대 30건 }

    ParameterPayload:
      type: object
      description: submitterTarget = T가 1.0에 도달하는 목표 서로 다른 제보자 수 (근거 없는 초기 추정치, O1)
      properties:
        submitterTarget: { type: integer }
        hitThreshold: { type: number }
        halflifeDays: { type: integer }
    ParameterDraft:
      allOf:
        - $ref: '#/components/schemas/ParameterPayload'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, REVIEW, APPROVED, APPLIED, ROLLED_BACK] }
            author: { type: string }
            hasSimulation: { type: boolean }
    SimulationResult:
      type: object
      properties:
        changed: { type: integer }
        total: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: "HIT → MISS" }
              count: { type: integer }
        affectedUsers: { type: integer }
        avgDelta: { type: number }
        demotions: { type: integer }
        promotions: { type: integer }
    ApprovalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        actionType: { type: string, enum: [PARAM_APPLY, VERDICT_REJUDGE, ITEM_VOID, LEDGER_ADJ, ACCOUNT_CREATE, ACCOUNT_ROLE_CHANGE] }
        targetRef: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        requestedByName: { type: string }
        approvals: { type: integer, description: 현재 승인 수 (0~1) }
        requiredApprovals: { type: integer, description: 항상 1 — 2인 승인 = 요청자 + 승인자 1명(SP3 K1) }
        status: { type: string, enum: [PENDING, PARTIAL, APPROVED, REJECTED, EXECUTED], description: "PARTIAL은 사용하지 않음(SP3)" }
        reason: { type: [string, 'null'] }
        summary: { type: string, description: 승인 화면 요약 한 줄(actionType별 ApprovalExecutor.describe) }
        createdAt: { type: string }
        resolvedAt: { type: [string, 'null'] }
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string, description: "표시 이름. 시스템 행(SLA_*)은 '(시스템)', 미인증은 '(미인증)'" }
        role: { type: string, enum: [REVIEWER, OPERATOR, ADMIN, AUDITOR, "-"], description: "행 기록 당시 role이 없으면 '-'" }
        action: { type: string, example: PII_VIEW }
        targetType: { type: string }
        targetId: { type: [string, 'null'], format: uuid }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string }

    # ── 확장 스키마 (05 §C) ──
    MeSummary:
      type: object
      properties:
        streakDays: { type: integer }
