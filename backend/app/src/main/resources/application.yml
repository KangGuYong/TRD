spring:
  application:
    name: trend-radar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/trd}   # 5433 = infra/docker-compose 매핑(로컬 PG 충돌 회피)
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:pw}
  jpa:
    hibernate:
      ddl-auto: validate    # 스키마는 Flyway가 소유. 자동 생성 절대 금지(04 §5.1)
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration   # persistence 모듈의 V1~V9

# 시간은 UTC 저장, 표시만 KST (04 §8)
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
