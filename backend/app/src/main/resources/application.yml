spring:
  application:
    name: trend-radar
  # 로컬 전용 오버라이드(gitignore 대상). 없으면 조용히 무시 — 다른 개발자/CI엔 영향 없음.
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/trd}   # 5433 = infra/docker-compose 매핑(로컬 PG 충돌 회피). 다른 호스트는 DB_URL로 지정
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:pw}
  jpa:
    hibernate:
      ddl-auto: validate    # 스키마는 Flyway가 소유. 자동 생성 절대 금지(04 §5.1)
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration   # persistence 모듈의 V1~V13

# 제보 기기 ID·IP를 해시하는 서버 비밀값(SP4 §4). 비어 있으면 기동 실패 — infra/.env(또는 로컬 app/.env)에 둔다.
# 바꾸면 이전 제보와 같은 기기·IP로 묶이지 않는다.
signal:
  hash-secret: ${SIGNAL_HASH_SECRET:}

# Firebase 서비스 계정 키 JSON 경로. 환경변수 FIREBASE_CREDENTIALS_PATH로 주입한다.
# 미설정·빈 값이면 앱은 정상 기동하되 인증이 필요한 /v1 요청은 401(빈 값 판정은 FirebaseConfig).
# 기본값(:)을 빼면 미설정 시 placeholder를 풀지 못해 기동 자체가 실패한다.
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 온프레미스 한국어 임베딩(KURE-v1, TEI). infra/docker-compose의 embeddings 서비스(M2).
embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:6000}

# 시간은 UTC 저장, 표시만 KST (04 §8)
server:
  port: ${PORT:8080}
  # 프록시 뒤에 둘 때만 native/framework로 — 믿을 수 없는 X-Forwarded-For로 IP 해시를 속이지 못하게 기본은 none(SP4 §4).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m   # 관리자 콘솔 세션 타임아웃(ADM-800). /v1/**는 STATELESS라 세션을 안 써서 영향 없음.
    encoding:
      charset: UTF-8
      # JSON 응답은 Content-Type에 charset을 안 붙인다(RFC 8259, UTF-8 고정) — MockHttpServletResponse가
      # 기본 ISO-8859-1로 디코딩해 한글 detail 메시지가 깨진다. 응답 인코딩을 명시적으로 강제한다.
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
