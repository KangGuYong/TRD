services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trd-db
    environment:
      POSTGRES_DB: trd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw
    ports:
      # 호스트 5433 → 컨테이너 5432. (로컬 설치 PostgreSQL이 5432를 점유하는 충돌 회피)
      - "5433:5432"
    volumes:
      - trd-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trd"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  trd-db:


