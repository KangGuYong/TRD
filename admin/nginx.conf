# 관리자 콘솔: 정적 파일(vite build) + /admin/** API 프록시.
# SPA와 API를 같은 출처로 서빙해야 세션 쿠키와 XSRF-TOKEN 쿠키가 그대로 오간다(vite dev 프록시와 같은 구조).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 도커 내장 DNS로 요청 시점에 백엔드 주소를 해석한다 — 백엔드 컨테이너만 재생성돼 IP가 바뀌어도 502가 나지 않는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /admin/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 파일명에 해시가 붙는 빌드 산출물 — 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 진입점(index.html)은 캐시하지 않는다 — 재배포 직후 새 번들을 바로 받게.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
